<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="High-Yield Medical Quick Recap App with Touch-Swipe Flashcards, Dynamic Exams, Hard Questions Bank, and Bengali Explanations.">
  <title>Medical Quick Recap</title>

  <!-- Google Fonts: Hind Siliguri for Bengali Unicode rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/app.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <div class="header-title-box">
      <button class="icon-btn" id="header-back-btn" style="display: none;" title="Go Back">
        ←
      </button>
      <div class="brand-badge">🩺 RECAP</div>
      <span id="header-title" style="font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">
        Medical Quick Recap
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <button class="theme-mode-btn" id="theme-toggle-btn" title="Cycle Reading Theme Temperature (Sepia Paper / Daylight / Night)">
        <span id="theme-toggle-icon">📜</span>
        <span id="theme-toggle-label" class="theme-label-text">Sepia</span>
      </button>
    </div>

    <!-- Thin Progress Bar on top for topic progress -->
    <div class="thin-progress-container">
      <div class="thin-progress-bar" id="thin-progress-bar"></div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="app-container" id="app-root">
    <!-- Populated dynamically by app.js -->
  </main>

  <!-- Module Script -->
  <script type="module" src="./js/app.js"></script>

  <!-- Offline Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>
</body>
</html>
